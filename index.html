<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0d0f0e" />
    <link rel="icon" href="data:," />
    <title>Tentando Sobreviver</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0f0e; overflow: hidden; }
      /* Sem rolagem, zoom ou seleção por toque: o jogo recebe todos os dedos. */
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
      /* Celular em pé: pede para girar (o jogo é pensado na horizontal). */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0d0f0e; color: #d8d8d0;
        font: 18px monospace; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
      #rotate b { font: 34px Impact, "Arial Black", sans-serif; letter-spacing: 1px; }
      @media (orientation: portrait) and (any-pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><b>⟳ GIRE O CELULAR</b><span>Tentando Sobreviver é jogado na horizontal</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
